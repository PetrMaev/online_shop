{% extends 'catalog/base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="mb-5">
    <p class="text-center h1">Вход на сайт</p>
</div>
<div class="row">
    <div class="col-1"></div>
    <div class="col-6">
    <h2>Форма для входа на сайт</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Войти</button>
        </form>
    </div>
</div>
{% endblock %}
