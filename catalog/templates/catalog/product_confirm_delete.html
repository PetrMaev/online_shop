{% extends 'blog/base.html' %}

{% block title %}Удаление продукта из списка{% endblock %}

{% block content %}
<h2>Удалить продукт</h2>
<p>Вы уверены, что хотите удалить продукт "{{ product.product_name }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'catalog:product_detail' product.pk %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
