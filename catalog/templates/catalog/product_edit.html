{% extends 'catalog/base.html' %}

{% block title %}Редактирование информации о продукте{% endblock %}

{% block content %}
<div class="row">
    <div class="col-1"></div>
    <div class="col-6">
    <h2>Редактирование информации о продукте</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'catalog:product_detail' product.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
    </div>
</div>
{% endblock %}
