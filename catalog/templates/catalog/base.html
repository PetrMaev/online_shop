<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Главная{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="row">
    <div class="col-2 mt-1">
        <div class="card text-bg-dark mb-5 h-100 w-100" style="max-width: 18rem; position: absolute;">
            <div class="card-header h4">Меню</div>
            <div class="card-body">
                <div class="d-grid gap-2 col-12 mx-auto">
                    <a href="/">
                        <button type="button" class="btn btn-primary w-100">Главная</button>
                    </a>
                    <a href="/categories_list/">
                        <button type="button" class="btn btn-primary w-100">Категории</button>
                    </a>
                    <a href="#">
                        <button type="button" class="btn btn-primary w-100">Заказы</button>
                    </a>
                    <a href="/contacts/">
                        <button type="button" class="btn btn-primary w-100">Контакты</button>
                    </a>
                </div>
            </div>
            <div class="card-footer bg-transparent border-success">
                <div class="dropdown">
                    <button class="btn btn-dark dropdown-toggle" type="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                        Пользователь
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">Профиль</a></li>
                        <li><a class="dropdown-item" href="#">Выход</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <div class="col-9 mt-5">
        {% block content %}{% endblock %}
    </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
