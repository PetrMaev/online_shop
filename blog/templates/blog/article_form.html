{% extends 'blog/base.html' %}

{% block title %}Форма статьи{% endblock %}

{% block content %}
<h2>Форма статьи</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Создать</button>
    <a href="{% url 'blog:articles_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
