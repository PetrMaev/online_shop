{% extends 'blog/base.html' %}
{% load new_tags %}
{% block title %}Главная страница{% endblock %}

{% block content %}
<div class="mb-5">
    <p class="text-center h1">Главная</p>
</div>
<div class="row">
    {% for article in articles %}
    <div class="col-2"></div>
    <div class="col-4">
        <div class="row row-cols-2 row-cols-md-1 g-4">
            <div class="col">
                <div class="card text-center border-light mb-5" style="max-width: 18rem;">
                    <img src="{{ article.preview | media_filter }}" class="card-img-top" alt="unnamed_box">
                    <div class="card-body">
                        <h5 class="card-title">{{ article.title }}</h5>
                        <p class="card-text">{{ article.content|truncatechars:100 }}</p>
                        <a href="{% url 'blog:article_detail' article.id %}"><button type="submit" class="btn btn-primary w-100">Подробнее</button></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
